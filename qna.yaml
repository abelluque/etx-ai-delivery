  - context: |
      The Cloud Controller Manager Operator provides features for the CloudControllerManager capability.

      Note

      Currently, disabling the CloudControllerManager capability is not supported on all platforms.

      You can determine if your cluster supports disabling the CloudControllerManager capability by checking values in the installation configuration (install-config.yaml) file for your cluster.

      In the install-config.yaml file, locate the platform parameter.

      - If the value of the platform parameter is Baremetal or None, you can disable the CloudControllerManager capability on your cluster.
      - If the value of the platform parameter is External, locate the platform.external.cloudControllerManager parameter. If the value of the platform.external.cloudControllerManager parameter is None, you can disable the CloudControllerManager capability on your cluster.

      Important

      If these parameters contain any other values than those listed, you cannot disable the CloudControllerManager capability on your cluster.

      Note

      The status of this Operator is General Availability for Amazon Web Services (AWS), Google Cloud Platform (GCP), IBM Cloud®, global Microsoft Azure, Microsoft Azure Stack Hub, Nutanix, Red Hat OpenStack Platform (RHOSP), and VMware vSphere.

      The Operator is available as a Technology Preview for IBM Power® Virtual Server.

      The Cloud Controller Manager Operator manages and updates the cloud controller managers deployed on top of OpenShift Container Platform. The Operator is based on the Kubebuilder framework and controller-runtime libraries. It is installed via the Cluster Version Operator (CVO).

      It contains the following components:

      - Operator
      - Cloud configuration observer

      By default, the Operator exposes Prometheus metrics through the metrics service.
    questions_and_answers:
      - question: |
          What is the Cloud Controller Manager Operator?
        answer: |
          The Cloud Controller Manager Operator manages and updates the cloud controller managers deployed on top of OpenShift Container Platform. The Operator is based on the Kubebuilder framework and controller-runtime libraries.
      - question: |
          What is the status of this Operator?
        answer: |
          The status of this Operator is General Availability for Amazon Web Services (AWS), Google Cloud Platform (GCP), IBM Cloud®, global Microsoft Azure, Microsoft Azure Stack Hub, Nutanix, Red Hat OpenStack Platform (RHOSP), and VMware vSphere.
      - question: |
          What is the status of the cloud controller manager operator for IBM Power® Virtual Server?
        answer: |
          The Cloud Controller Manager Operator is available as a Technology Preview for IBM Power® Virtual Server.
  - context: |
        If you used OpenShift Container Platform 3 and want to try OpenShift Container Platform 4, you need to understand how different OpenShift Container Platform 4 is. 
        OpenShift Container Platform 4 weaves the Operators that package, deploy, and manage Kubernetes applications and the operating system that the platform runs on,
        Red Hat Enterprise Linux CoreOS (RHCOS), together seamlessly. Instead of deploying machines and configuring their operating systems so that you can install OpenShift Container Platform on them, 
        the RHCOS operating system is an integral part of the OpenShift Container Platform cluster. Deploying the operating system for the cluster machines is part of the installation process for OpenShift Container Platform. 
        See Differences between OpenShift Container Platform 3 and 4.
        Because you need to provision machines as part of the OpenShift Container Platform cluster installation process, you cannot upgrade an OpenShift Container Platform 3 cluster to OpenShift Container Platform 4.
        Instead, you must create a new OpenShift Container Platform 4 cluster and migrate your OpenShift Container Platform 3 workloads to them.
    questions_and_answers:
      - question: |
            What need to understand the Difference between Container Platform 3 and OpenShift Container Platform 4?
        answer: |
            you need to understand how different OpenShift Container Platform 4 is. 
            OpenShift Container Platform 4 weaves the Operators that package, deploy, and manage Kubernetes applications and the operating system that the platform runs on,
            Red Hat Enterprise Linux CoreOS (RHCOS)
      - question: |
            What is a part of deploying OpenShift Container Platform?
        answer: |
            Deploying the operating system for the cluster machines is part of the installation process for OpenShift Container Platform.
      - question: |
            How to migrate from Container Platform 3 to Container Platform 4
        answer: |
            You must create a new OpenShift Container Platform 4 cluster and migrate your OpenShift Container Platform 3 workloads to them.